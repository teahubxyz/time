name: steward
# PROPOSED, NOT ACTIVE. A human installs this as .github/workflows/steward.yml after independent review
# (workflow files are off limits to the worker, and Time never auto-merges anything under .github/).
#
# The factory's repair tick, every 6 hours: `.github/time/steward.py` merges the card PRs that are approved, green and
# unprotected, closes the andons whose cause has healed, and re-dispatches a failed heartbeat — all of that free, with no
# model call. Only what is left and is a real block goes to one Opus call with the repair charter, booked to the ledger
# like every other call. It writes one entry per run to the Astra log (#57): Merged / Fixed / Left.
#
#   TIME_STEWARD   the seat (default `claude:opus`); `off` disables the tick
#   escalation     the seat may open a `needs-human` issue ONLY for money beyond the caps or a human-only step
#                  (a login, a payment, a legal signature); the code refuses anything else, whatever the prompt says.
#
# Once this runs, the desktop-app scheduled steward is retired.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
# (GitHub-style `permissions:` are ignored by Gitea; the Actions token has write access to this repo)
concurrency:
  group: steward
  cancel-in-progress: false
jobs:
  tick:
    if: vars.TIME_STEWARD != 'off'
    runs-on: cron
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/time
          persist-credentials: false
      # the heartbeat's own env, so the steward judges a block against exactly the configuration the clock runs under,
      # plus TIME_STEWARD (the seat) and TIME_STEWARD_STEPS
      - run: python3 .github/time/steward.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIME_TOKEN: ${{ secrets.TIME_TOKEN }}   # repo secret: the `time` bot merges PRs (Gitea denies that to the Actions identity)
          TIME_SEAT_CLAUDE: ${{ secrets.TIME_SEAT_CLAUDE }}
          TIME_SEAT_HAIKU: ${{ secrets.TIME_SEAT_HAIKU }}
          TIME_SEAT_SONNET: ${{ secrets.TIME_SEAT_SONNET }}
          TIME_SEAT_OPUS: ${{ secrets.TIME_SEAT_OPUS }}
          TIME_SEAT_FABLE: ${{ secrets.TIME_SEAT_FABLE }}
          TIME_TRUSTED: ${{ vars.TIME_TRUSTED }}   # whose Approve counts; collaborators are trusted without being listed
          TIME_RUN_IMAGE: node:22-bookworm
          TIME_STEWARD: ${{ vars.TIME_STEWARD }}   # the seat, default `claude:opus`; `off` disables the tick
          TIME_STEWARD_STEPS: ${{ vars.TIME_STEWARD_STEPS }}   # tool steps in the one repair call (default 8)
          TIME_MODE: ${{ vars.TIME_MODE }}
          TIME_DAILY_CAP: ${{ vars.TIME_DAILY_CAP }}
          TIME_DAILY_USD: ${{ vars.TIME_DAILY_USD }}       # spend governor: dollars per day (default 5) …
          TIME_MONTHLY_USD: ${{ vars.TIME_MONTHLY_USD }}   # … and per month (default 100); ledger in time/ledger/
          TIME_CAP_SLACK: ${{ vars.TIME_CAP_SLACK }}
          TIME_ANTHROPIC_API: ${{ vars.TIME_ANTHROPIC_API }}
          TIME_CURSOR_MODEL: ${{ vars.TIME_CURSOR_MODEL }}
          TIME_REVIEW: ${{ vars.TIME_REVIEW }}             # the council whose verdict the merge test reads
          TIME_REVIEW_TIEBREAK: ${{ vars.TIME_REVIEW_TIEBREAK }}
          TIME_REVIEW_QUORUM: ${{ vars.TIME_REVIEW_QUORUM }}
          TIME_STUCK_HOURS: ${{ vars.TIME_STUCK_HOURS }}
          TIME_AUTOMERGE: ${{ vars.TIME_AUTOMERGE }}
          TIME_REQUIRE_CHECKS: ${{ vars.TIME_REQUIRE_CHECKS }}
          TIME_PROTECTED: ${{ vars.TIME_PROTECTED }}
          TIME_PARALLEL: ${{ vars.TIME_PARALLEL }}
          TIME_PLANNER: ${{ vars.TIME_PLANNER }}
          TIME_WORKER: ${{ vars.TIME_WORKER }}
          TIME_WORKER_STEPS: ${{ vars.TIME_WORKER_STEPS }}
          TIME_WORKER_MAX_TOKENS: ${{ vars.TIME_WORKER_MAX_TOKENS }}
