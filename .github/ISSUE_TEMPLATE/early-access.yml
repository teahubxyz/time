name: Early access
description: Join the early-access list for one of the studio's ventures. No email, nothing charged.
title: "Early access: "
labels: ["signup"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for raising your hand. This is a **public** issue on Teahub: no email is collected and nothing is charged.
        The studio replies here, and what you write below shapes the next version.
  - type: input
    id: venture
    attributes:
      label: Venture
      description: The venture's name, as on the page you came from (the title already carries it, so you can leave this empty).
      placeholder: e.g. mdecks
    validations:
      required: false
  - type: input
    id: plan
    attributes:
      label: Plan
      description: The tier you would want. Paid tiers are early-access ideas; nothing is charged.
      placeholder: e.g. Free, or a founding tier
  - type: textarea
    id: use
    attributes:
      label: What would you use it for?
      description: One or two sentences about your use. This decides what gets built next.
