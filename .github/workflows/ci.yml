name: ci
# Time's own tests. Also the check that lets Time auto-merge changes to itself.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["time/ledger/**"]   # Time appends its own spend ledger every run; that is not a code change
  workflow_dispatch:   # Time can run CI on a worker's PR branch by hand
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4   # node 22+ has node:sqlite, which the passkey test runs on
        with:
          node-version: 22
      - run: python3 .github/time/test_time.py
      - run: python3 .github/time/test_seed.py
