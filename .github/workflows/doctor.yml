name: doctor
# Manual check of Time's setup: label, settings, keys (never printed), today's spend. Result in the run summary.
on: workflow_dispatch
permissions:
  contents: read
  issues: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/time
      - run: python3 .github/time/test_time.py
      - run: python3 .github/time/time.py doctor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIME_VENTURE_DOMAIN: ${{ vars.TIME_VENTURE_DOMAIN }}
          TIME_MODE: ${{ vars.TIME_MODE }}
          TIME_DAILY_CAP: ${{ vars.TIME_DAILY_CAP }}
          TIME_DAILY_USD: ${{ vars.TIME_DAILY_USD }}
          TIME_MONTHLY_USD: ${{ vars.TIME_MONTHLY_USD }}
          TIME_REVIEW: ${{ vars.TIME_REVIEW }}
          TIME_WORKER: ${{ vars.TIME_WORKER }}
          TIME_AUTOMERGE: ${{ vars.TIME_AUTOMERGE }}
