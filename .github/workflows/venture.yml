name: venture
# The venture loop: one stage per tick. Daily kickoff plus a nudge every 20 minutes while a card is open
# (cheap: a tick with no open card and TIME_VENTURE!=on exits at once). Off until TIME_VENTURE=on.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
concurrency:
  group: venture
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/time
      - run: python3 .github/time/venture.py tick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          TIME_VENTURE: ${{ vars.TIME_VENTURE }}
          TIME_VENTURE_PITCH: ${{ vars.TIME_VENTURE_PITCH }}
          TIME_VENTURE_BOARD: ${{ vars.TIME_VENTURE_BOARD }}
          TIME_WORKER: ${{ vars.TIME_WORKER }}
          TIME_WORKER_STEPS: ${{ vars.TIME_WORKER_STEPS }}
